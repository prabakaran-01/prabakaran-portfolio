  <rect x="58" y="85" width="494" height="42" rx="6" fill="#1C1C24" stroke="#29292F" stroke-width="1"/>
  <rect x="75" y="98" width="80" height="16" rx="4" fill="#B7FF3C"/>
  <text x="85" y="110" fill="#0A0A0C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10">COMPANY</text>
